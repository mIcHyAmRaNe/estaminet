[package]
name = "estaminet"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "estaminet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
wreq = { version = "0.16", features = ["cookies", "form", "json"] }
wreq-util = "0.2"
url = "2"
rustls = { version = "0.23", features = ["ring"] }
# socketioxide removed — unused server-side framework; client uses manual 42["event",...] via `socket_io()` helper in commands/chat.rs (tokio-tungstenite)
thiserror = "2"
dirs = "5"
chrono = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
