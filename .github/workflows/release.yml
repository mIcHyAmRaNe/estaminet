name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies (deb build)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="$(mktemp)"
          awk -v ver="$version" '
            /^## / {
              if (found) exit
              h=$2; gsub(/[\[\]]/, "", h)
              if (h == ver) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "::warning::No CHANGELOG.md section found for ## $version — release body will only contain the assets footer."
          fi
          {
            echo "body<<RELEASE_BODY_EOF"
            cat "$notes_file"
            echo ""
            echo "---"
            echo "See assets for .deb (Linux) and -setup.exe (Windows)."
            echo "Verify provenance: gh attestation verify <file> -R mIcHyAmRaNe/estaminet"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # No separate `bun run build` step: tauri.conf.json
      # beforeBuildCommand (`bun run build`) covers it.
      # NOTE: releaseDraft is false on purpose — the updater's
      # latest.json endpoint 404s on draft releases, silently
      # breaking in-app update checks.
      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Estaminet v__VERSION__'
          # Body is the matching CHANGELOG.md ## <version> section plus the
          # assets footer (see 'Extract release notes' step above).
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish checksums
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/nsis/*.exe)
          sha256sum "${files[@]}" > "SHA256SUMS-${{ matrix.platform }}"
          gh release upload "$GITHUB_REF_NAME" "SHA256SUMS-${{ matrix.platform }}" --clobber
