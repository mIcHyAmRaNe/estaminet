<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" role="img" aria-label="Taverne">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#cba6f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="340" height="200" fill="url(#bg)"/>
  <rect width="340" height="200" fill="url(#glow)"/>
  <!-- hanging sign -->
  <line x1="170" y1="28" x2="170" y2="58" stroke="#45475a" stroke-width="4" stroke-linecap="round"/>
  <rect x="108" y="58" width="124" height="94" rx="12" fill="#181825" stroke="#45475a" stroke-width="3"/>
  <!-- mug -->
  <g stroke="#cba6f7" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="140" y="88" width="38" height="46" rx="6"/>
    <path d="M178 98 h12 a8 8 0 0 1 8 8 v8 a8 8 0 0 1 -8 8 h-12"/>
    <line x1="150" y1="104" x2="150" y2="118"/>
    <line x1="160" y1="104" x2="160" y2="118"/>
  </g>
  <!-- foam -->
  <circle cx="146" cy="84" r="7" fill="#cba6f7"/>
  <circle cx="159" cy="79" r="9" fill="#cba6f7"/>
  <circle cx="173" cy="84" r="7" fill="#cba6f7"/>
</svg>
